# ============================================================
# Argus V1 — Schéma d'harmonisation des labels
# ============================================================
# Rôle : traduire les classes hétérogènes des datasets sources
# vers la taxonomie unifiée d'Argus.
#
# Le mapping est basé sur les NOMS de classe, pas sur les IDs
# entiers : les IDs changent d'une version de dataset à l'autre
# (surtout sur Roboflow), les noms sont stables. Le script data/
# lit le `data.yaml` de chaque dataset (id -> nom), applique cette
# table, puis réécrit les .txt YOLO avec les IDs Argus ci-dessous.
#
# 3 opérations possibles par classe source :
#   - renommer  : person   -> person
#   - fusionner : blue/yellow/white/red -> helmet
#   - jeter     : NO-Hardhat -> drop   (la ligne est supprimée)
#
# ⚠️ Les noms exacts sont à CONFIRMER sur le data.yaml réel au
#    téléchargement — voir les notes ⚠️ par dataset.

# ---- Taxonomie cible : IDs FIXES d'Argus ----
argus_classes:
  0: person
  1: helmet
  2: safety-vest
  3: mask
  4: shoes

# ---- Datasets sources ----
datasets:

  sh17:
    # 17 classes. SEULE source qui annote shoes ET mask nativement.
    # Sert aussi de base au modèle v0 pour le pseudo-labeling.
    # Source : Kaggle `mugheesahmad/sh17-dataset-for-ppe-detection` (format YOLO).
    # Noms VERROUILLÉS sur le data.yaml réel du dataset (minuscules ; ordre IDs
    # différent du README -> raison d'être du mapping par NOM, pas par ID).
    role: train
    holdout: false
    map:
      person: person            # id 0
      helmet: helmet            # id 10
      safety-vest: safety-vest  # id 16
      face-mask: mask           # id 5
      shoes: shoes              # id 14
      # --- jetés (hors taxonomie V1) ---
      ear: drop
      ear-mufs: drop
      face: drop
      face-guard: drop
      foot: drop
      tool: drop
      glasses: drop
      gloves: drop
      hands: drop
      head: drop
      medical-suit: drop
      safety-suit: drop

  chv:
    # CONFIRMÉ : dataset CHV (1330 img — person + vest + casques 4 couleurs).
    # Source : repo GitHub ZijianWang-ZW/PPE_detection -> données sur Google Drive/Baidu.
    # ⚠️ Noms de classe exacts + format à LIRE dans son data.yaml au download
    #    (peut être en VOC/XML -> convertir en YOLO avant remap).
    # N'annote NI mask NI shoes -> pseudo-label requis.
    role: train
    holdout: false
    map:
      blue: helmet       # ⚠️ noms exacts à confirmer sur le data.yaml
      yellow: helmet
      white: helmet
      red: helmet
      person: person
      vest: safety-vest
    pseudo_label: [mask, shoes]   # prédits par v0, corrigés sur échantillon

  pictor:
    # Pictor-v3 Approche A1 (worker/hat/vest séparés).
    # Source : GitHub officiel ciber-lab/pictor-ppe -> Google Drive (Images/ + Labels/,
    #   fichiers `..._approach-01_{train,valid,test}.txt`).
    # ⚠️ La version Roboflow ppe-orxtt/ppe-u7jtr était la variante COMBINÉE
    #    (W/WH/WV/WHV) -> inutilisable, écartée.
    # Format source = keras-yolo3 consolidé -> converti en YOLO par data/convert_pictor.py.
    # Classes A1 : 0=hat, 1=vest, 2=worker (ordre déduit géométriquement, à confirmer à l'EDA).
    role: train
    holdout: false
    map:
      hat: helmet
      vest: safety-vest
      worker: person
    pseudo_label: [mask, shoes]

  css-data:
    # HOLDOUT cross-dataset : JAMAIS en entraînement, JAMAIS pseudo-labellisé.
    # Version Roboflow v30 CONFIRMÉE : 25 classes (data.yaml). On en garde 4.
    # Structure Roboflow : train/ valid/ test/, labels dans <split>/labels/.
    # Permet l'éval hors-domaine de : helmet, safety-vest, mask, person.
    # (shoes n'est dans aucune autre source -> éval intra-SH17 seulement.)
    role: holdout
    holdout: true
    map:
      # --- gardés (noms exacts confirmés sur le data.yaml v30) ---
      Hardhat: helmet
      Safety Vest: safety-vest
      Mask: mask
      Person: person
      # --- jetés explicitement (le reste des 25 -> drop auto par défaut sûr) ---
      Gloves: drop
      NO-Hardhat: drop         # l'absence est inférée par le moteur, pas détectée
      NO-Mask: drop
      NO-Safety Vest: drop
      Safety Cone: drop
      Ladder: drop
      Excavator: drop
      machinery: drop
      vehicle: drop
      # (+ SUV, bus, dump truck, fire hydrant, mini-van, sedan, semi, trailer,
      #  truck, truck and trailer, van, wheel loader -> drop automatique)
